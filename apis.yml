name: Automotus
description: >-
  Automotus is a smart-city and urban-mobility technology company that provides
  automated curb management using computer vision. Its CurbSight AI cameras use
  automatic license plate recognition (ALPR), 5G connectivity, edge processing,
  and privacy-by-design to monitor curb activity, while CurbPass handles curb
  access payment and invoicing and CurbSuite delivers an enforcement and
  analytics dashboard. Automotus works with cities, airports, and commercial
  fleets to reduce congestion, improve safety and compliance, cut emissions, and
  generate new curb revenue. It was surfaced as a Techstars portfolio company and
  added to the API Evangelist network for enrichment; no public developer/API
  surface has been found yet.
